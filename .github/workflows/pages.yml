name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 treats `node --test tests/` as a module path (MODULE_NOT_FOUND).
      # Glob only the unit tests; tests/e2e.mjs needs a browser.
      - run: node --test tests/*.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js lib fonts icons vendor tessdata _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v4
