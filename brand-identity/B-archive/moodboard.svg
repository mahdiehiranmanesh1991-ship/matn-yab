  <text x="300" y="420" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="#242628">حس پژوهشخانه</text>
  <text x="300" y="450" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" fill="#5C6570">شبکه، زبانه، علامت ثبت - دقت بدون سردی شرکتی</text>
  <text x="880" y="520" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" fill="#1F4E5F">مس / پرشین‌تیل - نه طلای لوکس</text>
