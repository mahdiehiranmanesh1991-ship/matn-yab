<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="مودبورد جهت B">
  <title>مودبورد - آرشیو حقوقی معاصر</title>
  <rect width="960" height="640" fill="#D6D9DC"/>
  <rect x="40" y="40" width="880" height="560" fill="#FFFFFF" stroke="#9AA3A8" stroke-width="1"/>
  <rect x="40" y="40" width="880" height="48" fill="#1F4E5F"/>
  <text x="60" y="70" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" fill="#FFFFFF">AE ARCHIVE - SERIES 02</text>
  <text x="880" y="70" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" fill="#D6D9DC">آرشیو زنده</text>
  <line x1="320" y1="88" x2="320" y2="600" stroke="#D6D9DC"/>
  <line x1="640" y1="88" x2="640" y2="600" stroke="#D6D9DC"/>
  <text x="300" y="130" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="28" font-weight="600" fill="#242628">فهرست‌پذیر</text>
  <text x="300" y="165" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" fill="#1F4E5F">هر محتوا یک کد ارجاع دارد</text>
  <rect x="180" y="190" width="120" height="8" fill="#A66A4E"/>
  <text x="600" y="140" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="36" font-weight="500" fill="#242628" letter-spacing="3">آوای عدالت</text>
  <text x="600" y="175" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" fill="#9AA3A8">tracking باز - وزن متوسط</text>
  <g transform="translate(360,220)">
    <rect width="70" height="90" fill="#242628"/><text x="35" y="110" text-anchor="middle" font-size="9" fill="#5C6570" font-family="Vazirmatn, Tahoma, sans-serif">#242628</text>
    <rect x="78" width="70" height="90" fill="#D6D9DC"/><text x="113" y="110" text-anchor="middle" font-size="9" fill="#5C6570" font-family="Vazirmatn, Tahoma, sans-serif">#D6D9DC</text>
    <rect x="156" width="70" height="90" fill="#1F4E5F"/><text x="191" y="110" text-anchor="middle" font-size="9" fill="#5C6570" font-family="Vazirmatn, Tahoma, sans-serif">#1F4E5F</text>
    <rect x="234" width="70" height="90" fill="#A66A4E"/><text x="269" y="110" text-anchor="middle" font-size="9" fill="#5C6570" font-family="Vazirmatn, Tahoma, sans-serif">#A66A4E</text>
    <rect x="312" width="70" height="90" fill="#9AA3A8"/><text x="347" y="110" text-anchor="middle" font-size="9" fill="#5C6570" font-family="Vazirmatn, Tahoma, sans-serif">#9AA3A8</text>
  </g>
  <g transform="translate(680,140)">
    <rect x="8" y="8" width="100" height="130" fill="none" stroke="#1F4E5F" stroke-width="2"/>
    <rect x="20" y="20" width="100" height="130" fill="#D6D9DC" stroke="#242628" stroke-width="2"/>
    <rect x="100" y="20" width="20" height="14" fill="#A66A4E"/>
    <line x1="40" y1="60" x2="100" y2="60" stroke="#9AA3A8"/>
    <line x1="40" y1="80" x2="90" y2="80" stroke="#9AA3A8"/>
    <line x1="40" y1="100" x2="95" y2="100" stroke="#9AA3A8"/>
