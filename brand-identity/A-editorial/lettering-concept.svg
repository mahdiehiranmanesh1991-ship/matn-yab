<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="مفهوم حروف‌نگاری فارسی - جهت A">
  <title>Lettering Concept A</title>
  <rect width="900" height="520" fill="#EEF1F4"/>
  <text x="860" y="40" text-anchor="end" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" fill="#5C6570">مفهوم وردمارک فارسی - جهت A</text>
  <image href="wordmark.svg" x="80" y="80" width="740" height="200" preserveAspectRatio="xMidYMid meet"/>
  <rect x="80" y="300" width="740" height="1" fill="#A8B2BC"/>
  <g font-family="Vazirmatn, Tahoma, sans-serif" fill="#12151C" font-size="13">
    <text x="860" y="340" text-anchor="end" font-weight="700">تصمیم حروف‌نگاری</text>
    <text x="860" y="365" text-anchor="end" fill="#5C6570">الف‌های بلند و فشرده - حس ستون سرمقاله بدون ستون کلاسیک</text>
    <text x="860" y="390" text-anchor="end" fill="#5C6570">فاصله حروف منفی خفیف - تراکم مجله معتبر</text>
    <text x="860" y="415" text-anchor="end" fill="#5C6570">وزن 850 - کنتراست نمایشی؛ کانترهای ع و د باز نگه داشته شده‌اند</text>
    <text x="860" y="440" text-anchor="end" fill="#5C6570">برش قرمز جدا از حروف می‌ماند تا خوانایی آسیب نبیند</text>
    <text x="860" y="480" text-anchor="end" fill="#B91C2C" font-size="12">نمونه اولیه: مسیرهای outlined از وزیرمتن - پایه بازنویسی دستی حروف</text>
  </g>
</svg>
