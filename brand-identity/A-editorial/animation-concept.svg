<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="مفهوم انیمیشن لوگو - جهت A">
  <title>Motion A - قواعد، برش قرمز، سپس نام</title>
  <rect width="640" height="360" fill="#12151C"/>
  <text x="24" y="32" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" fill="#A8B2BC">0.0s rules - 0.6s cut - 1.0s wordmark - 2.4s loop</text>
  <rect x="320" y="80" width="0" height="4" fill="#EEF1F4">
    <animate attributeName="width" values="0;200;200" keyTimes="0;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="320;220;220" keyTimes="0;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="320" y="110" width="0" height="3" fill="#A8B2BC">
    <animate attributeName="width" values="0;160;160" keyTimes="0;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="320;240;240" keyTimes="0;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="320" y="136" width="0" height="2" fill="#5C6570">
    <animate attributeName="width" values="0;120;120" keyTimes="0;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="320;260;260" keyTimes="0;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="314" y="70" width="12" height="0" fill="#EEF1F4">
    <animate attributeName="height" values="0;120;120" keyTimes="0;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="240" y="128" width="160" height="5" fill="#B91C2C" opacity="0" transform="rotate(-12 320 130)">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="320" y="260" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" opacity="0">آوای عدالت
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.75;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="320" y="300" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" fill="#A8B2BC" opacity="0">اقتدار سرمقاله‌ای
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
